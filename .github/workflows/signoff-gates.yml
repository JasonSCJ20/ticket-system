name: Sign-off Gates

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: node-backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd node-backend
          npm ci

      - name: Run backend tests
        run: |
          cd node-backend
          npm test

      # --omit=dev: only the dependencies that actually ship to production
      # gate the build. Dev-only tooling (Jest and its transitive deps, etc.)
      # never runs in production and floods this check with irrelevant noise
      # otherwise — track those separately, don't block every commit on them.
      - name: Audit backend dependencies (production, high+)
        run: |
          cd node-backend
          npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend-v2
          npm ci

      - name: Run frontend tests
        run: |
          cd frontend-v2
          npm test

      - name: Build frontend
        run: |
          cd frontend-v2
          npm run build

      - name: Audit frontend dependencies (production, high+)
        run: |
          cd frontend-v2
          npm audit --omit=dev --audit-level=high

  agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            agent/package-lock.json
            node-backend/package-lock.json

      # The agent's tests import node-backend's app.js/models directly to run
      # a real backend instance against the real agent middleware — so both
      # packages' dependencies must be installed, not just the agent's own.
      - name: Install node-backend dependencies
        run: |
          cd node-backend
          npm ci

      - name: Install agent dependencies
        run: |
          cd agent
          npm ci

      - name: Run agent tests
        run: |
          cd agent
          npm test

      - name: Audit agent dependencies (production, high+)
        run: |
          cd agent
          npm audit --omit=dev --audit-level=high

  sentinel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            sentinel/package-lock.json
            node-backend/package-lock.json

      # Same reason as the agent job: sentinel's integration tests import
      # node-backend's app.js/models directly to run a real backend instance
      # against the real sentinel daemon.
      - name: Install node-backend dependencies
        run: |
          cd node-backend
          npm ci

      - name: Install sentinel dependencies
        run: |
          cd sentinel
          npm ci

      - name: Run sentinel tests
        run: |
          cd sentinel
          npm test

      - name: Audit sentinel dependencies (production, high+)
        run: |
          cd sentinel
          npm audit --omit=dev --audit-level=high
